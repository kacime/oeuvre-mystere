<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Deviner une œuvre à partir d'une émotion et de phrases de membres : amusant, faisable, avec une montée ? -->
<!-- Date: 2026-11-10 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Œuvre mystère · grille</title>
<style>
  :root {
    --bg: #F6F1E8; --card: #FFFFFF; --ink: #1B090A; --ink2: #746C66; --line: #E6DED1;
    --em-bg: #C4A7FF; --em-fg: #3A0044;
    --flip: .5s; --blur-art: 12px; --blur-ini: 1.5px;
    --title: "GT Walsheim Condensed", "Noto Sans", Inter, "Helvetica Neue", Arial, sans-serif;
    --text: Inter, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.4 var(--text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .h { font-family: var(--title); font-weight: 900; font-stretch: condensed; letter-spacing: -.01em; line-height: 1.02; margin: 0; }
  #app { max-width: 440px; margin: 0 auto; min-height: 100dvh; position: relative; }

  /* top bar */
  #bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #bar .back { display: flex; align-items: center; gap: 2px; min-height: 44px; min-width: 44px; padding: 0 8px 0 0; border: 0; background: none; font-size: 15px; }
  #bar .back svg { width: 22px; height: 22px; }
  #bar .mid { flex: 1; text-align: center; font-size: 20px; }
  #bar .num { min-width: 52px; text-align: right; font-size: 14px; color: var(--ink2); }
  #bar.tint { background: var(--em-bg); color: var(--em-fg); border-color: transparent; }
  #bar.tint .num { color: inherit; }
  #bar.tint .pill { padding: 0; font-size: 15px; font-weight: 800; }
  .brand { font-family: var(--title); font-weight: 900; font-size: 24px; letter-spacing: -.02em; }

  main { padding: 16px 16px 24px; }
  main.play { padding-bottom: 200px; }

  /* emotion glyphs and pills */
  .glyph { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .pill i { width: 20px; height: 20px; display: inline-block; }

  /* home */
  .daycard { border-radius: 20px; overflow: hidden; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  .daycard .top { background: var(--em-bg); color: var(--em-fg); padding: 18px 18px 16px; display: flex; gap: 14px; align-items: center; }
  .daycard .top .ico { width: 64px; height: 64px; flex: none; }
  .daycard .top small { display: block; font-size: 14px; font-weight: 600; opacity: .9; }
  .daycard .top .h { font-size: 30px; }
  .daycard .body { padding: 16px 18px 18px; }
  .daycard ol { margin: 0 0 16px; padding-left: 20px; color: var(--ink); font-size: 15px; }
  .daycard ol li { margin: 4px 0; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 14px; border: 1.5px solid var(--ink); background: var(--card); font-weight: 700; font-size: 16px; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn svg { width: 22px; height: 22px; }
  .counter { display: flex; align-items: center; gap: 12px; margin: 18px 2px 8px; }
  .counter .big { font-size: 40px; }
  .counter span { color: var(--ink2); font-size: 15px; }
  h2.sec { font-size: 22px; margin: 22px 2px 10px; }
  .days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .day { min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); text-align: left; }
  .day .sw { width: 40px; height: 40px; flex: none; border-radius: 10px; padding: 6px; }
  .day b { display: block; font-size: 15px; }
  .day span { font-size: 14px; color: var(--ink2); }
  .day.cur { border: 2px solid var(--ink); }
  .note { font-size: 14px; color: var(--ink2); margin: 18px 2px 0; }

  /* play */
  .emo { border-radius: 20px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; background: var(--em-bg); color: var(--em-fg); }
  .emo .ico { width: 72px; height: 72px; flex: none; }
  .emo small { font-size: 14px; font-weight: 600; display: block; }
  .emo .h { font-size: 40px; }
  .clues { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; perspective: 900px; }
  .clue { scroll-margin: 72px 0 180px; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .clue .k { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .clue .lab { font-size: 14px; color: var(--ink2); font-weight: 600; }
  .clue .val { font-size: 18px; font-weight: 600; }
  .clue .val.h { font-size: 26px; font-weight: 900; }
  .clue q { display: block; font-size: 18px; line-height: 1.35; quotes: "« " " »"; }
  .clue .mico { width: 28px; height: 28px; display: inline-block; vertical-align: -6px; margin-right: 4px; }
  .clue.locked { background: transparent; border-style: dashed; color: var(--ink2); }
  .clue.locked .k { background: transparent; border: 1.5px dashed var(--ink2); color: var(--ink2); }
  .clue.locked .lock { width: 18px; height: 18px; display: inline-block; vertical-align: -3px; margin-right: 4px; }
  .clue.new { animation: flip var(--flip) cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 0; }
  @keyframes flip { from { transform: rotateX(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .kw { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--em-bg); color: var(--em-fg); font-weight: 800; font-size: 18px; }

  /* clue 6 / reveal picture: drawn from the emotion, never a real poster */
  .visual { position: relative; width: 100%; aspect-ratio: 3 / 4; max-width: 200px; border-radius: 14px; overflow: hidden; background: var(--em-bg); color: var(--em-fg); }
  .visual .art { position: absolute; inset: -20px; filter: blur(var(--blur-art)); }
  .visual .art svg { position: absolute; }
  .visual .ini { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--title); font-weight: 900; font-size: 64px; letter-spacing: .04em; filter: blur(var(--blur-ini)); }
  .visual.clear .art { filter: none; transition: filter 1.2s ease; }
  .visual.clear .ini { filter: none; place-items: start; padding: 10px 12px; font-size: 36px; transition: filter 1.2s ease; } /* sharp, moved up for the title */
  .visual .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; font-family: var(--title); font-weight: 900; font-size: 20px; line-height: 1.05; background: linear-gradient(transparent, rgba(0,0,0,.08)); }

  .tries { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .tries li { font-size: 15px; padding: 6px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .tries li.miss { text-decoration: line-through; color: var(--ink2); }
  .tries li.ok { background: var(--em-bg); color: var(--em-fg); border-color: transparent; font-weight: 700; }

  /* dock: one hand, at the bottom */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; }
  #dock .in { max-width: 440px; margin: 0 auto; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); pointer-events: auto; position: relative; }
  .blend { margin-top: 10px; padding: 8px; border-radius: 12px; background: var(--card); color: var(--ink); }
  .blend .bars { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
  .blend .bars i { display: block; height: 100%; }
  .blend ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
  .blend li { display: flex; align-items: center; gap: 4px; }
  .blend li .sq { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .blend li b { font-weight: 800; }
  .grid-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 20px 2px 8px; }
  .grid-head .h { font-size: 22px; }
  .grid-head span { font-size: 14px; color: var(--ink2); }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { position: relative; width: 100%; height: 100%; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 10px 8px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); text-align: left; transition: transform .15s, box-shadow .15s; }
  .tile b { font-size: 15px; line-height: 1.2; font-weight: 700; padding-right: 18px; }
  .tile span { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--ink2); }
  .tile .mico { width: 20px; height: 20px; flex: none; }
  .tile .x { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; color: var(--ink2); }
  .tile.sel { border-color: var(--ink); box-shadow: 0 0 0 3px var(--em-bg); transform: translateY(-1px); }
  .tile.out, .tile.tried { background: transparent; border-style: dashed; }
  .tile.out b, .tile.tried b { text-decoration: line-through; color: var(--ink2); font-weight: 600; }
  .tile.tried { cursor: default; }
  .tile.ok { background: var(--em-bg); border-color: transparent; }
  .tile.ok b, .tile.ok span { color: var(--em-fg); }
  .row { display: flex; gap: 8px; }
  #go { flex: 1; min-width: 0; }
  #go span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cross { width: auto; flex: none; padding: 0 14px; }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .pips { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink2); }
  .pips i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ink); display: inline-block; }
  .pips i.used { background: var(--ink); }
  #pass { width: auto; min-height: 44px; padding: 0 16px; border-style: dashed; }
  #msg { min-height: 0; font-size: 14px; color: var(--ink); margin: 6px 2px 0; }
  #msg:empty { display: none; }

  /* reveal */
  .outcome { font-size: 40px; margin: 4px 0 14px; }
  .work { display: flex; gap: 16px; align-items: flex-start; }
  .work .visual { width: 140px; flex: none; }
  .work .h { font-size: 30px; margin-bottom: 6px; }
  .work p { margin: 2px 0; color: var(--ink2); font-size: 15px; }
  .reco { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .reco header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .reco .av { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: var(--em-bg); color: var(--em-fg); }
  .reco header b { flex: 1; font-size: 15px; }
  .reco q { display: block; font-size: 17px; quotes: "« " " »"; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .share { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px dashed var(--ink2); font-size: 15px; }
  .share .dots { display: inline-flex; gap: 6px; vertical-align: -3px; margin-right: 8px; }
  .share .dots svg { width: 16px; height: 16px; }
  .share p { margin: 2px 0; }
  .links { display: flex; gap: 10px; margin-top: 14px; }

  #toast { position: fixed; left: 50%; top: 68px; transform: translateX(-50%); z-index: 9; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  #toast:empty { display: none; }

  /* figures (outline check) */
  .figs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .figs div { text-align: center; font-size: 14px; }
  .figs .sw { aspect-ratio: 1; border-radius: 14px; padding: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <main id="view"></main>
</div>
<div id="dock" hidden>
  <div class="in">
    <div class="row">
      <button id="go" class="btn primary"><span>Touchez une œuvre</span></button>
      <button id="cross" class="btn">Barrer</button>
    </div>
    <div class="row2">
      <div class="pips" id="pips"></div>
      <button id="pass" class="btn">Passer</button>
    </div>
    <p id="msg" role="status"></p>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
'use strict';
// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.flip_s is CONFIG.flip_s.value
const STEP = 1 / 60;            // simulation step in seconds
const TITLE = 'L\'Œuvre mystère';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- Drawn figures: every icon is an SVG path, never an emoji or a font symbol ------------
const GLYPH = {
  curiosite: '<circle cx="21" cy="21" r="11"/><path d="M29 29l11 11M16 18a6 6 0 0 1 7-3"/>',
  joie: '<circle cx="24" cy="24" r="8"/><path d="M24 6v6M24 36v6M6 24h6M36 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4"/>',
  trouble: '<path d="M6 16q6-7 12 0t12 0t12 0M4 25q6-7 12 0t12 0t12 0M8 34q6-7 12 0t12 0t12 0"/>',
  peur: '<path d="M6 32l6-11 5 8 6-16 5 13 6-10 5 9 4-5M10 40h28"/>',
  apaisement: '<path d="M6 30h36M14 30a10 10 0 0 1 20 0M9 36h13M26 36h13M14 41h20"/>',
  tristesse: '<path d="M24 7C24 7 12 21 12 30a12 12 0 0 0 24 0C36 21 24 7 24 7Z"/><path d="M18 31a6 6 0 0 0 5 6"/>',
  colere: '<path d="M24 6c4 8 12 12 12 22a12 12 0 0 1-24 0c0-6 4-9 6-12 1 5 3 7 6 7-2-6-2-11 0-17Z"/>',
  desir: '<path d="M24 40C10 30 6 22 10 15c4-7 12-5 14 2 2-7 10-9 14-2 4 7 0 15-14 25Z"/><path d="M17 17q2-3 5-1"/>',
};
const MEDIA = {
  'Film': '<rect x="7" y="20" width="34" height="20" rx="3"/><path d="M7 20l-1-7 33-5 2 7M13 12l5 6M22 11l5 6M31 9l5 6"/>',
  'Livre': '<path d="M24 14c-5-4-12-5-18-4v26c6-1 13 0 18 4 5-4 12-5 18-4V10c-6-1-13 0-18 4ZM24 14v26"/>',
  'Série': '<rect x="6" y="14" width="36" height="24" rx="4"/><path d="M18 6l6 8 6-8M16 42h16M12 20v12"/>',
  'Jeu vidéo': '<path d="M14 16h20c6 0 9 6 9 13 0 6-3 9-6 9-4 0-5-5-8-5H19c-3 0-4 5-8 5-3 0-6-3-6-9 0-7 3-13 9-13Z"/><path d="M15 22v8M11 26h8"/><path d="M32 24h.1M36 28h.1" stroke-width="4"/>',
};
const CROSS = '<path d="M12 12l24 24M36 12L12 36"/>';
const LOCK = '<rect x="11" y="21" width="26" height="20" rx="4"/><path d="M16 21v-5a8 8 0 0 1 16 0v5M24 29v5"/>';
const BACK = '<path d="M30 10L16 24l14 14"/>';
const svg = (inner, cls = 'glyph') => `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;
const DOT = (fill, stroke) => `<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;

// ---- Rules: title matching ignores case, accents, punctuation and a leading article ------
function norm(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
    .replace(/[’`]/g, "'")
    .replace(/^\s*(l'|le |la |les |the )/, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function gridOf(p) { // the answer and its 15 works, shuffled the same way every time for this game
  const list = [{ title: p.title, media: p.media, year: p.year }].concat(GRIDS[p.n].map(([title, media, year]) => ({ title, media, year })));
  seed = CONFIG.seed * 7919 + p.n;
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}
const decade = y => `années ${Math.floor(y / 10) * 10}`;
const ordinal = k => k === 1 ? '1er' : `${k}e`;
const initials = t => t.split(/[\s'’-]+/).filter(Boolean).map(w => w[0].toUpperCase()).join('');

// ---- Saved locally: results per game, and a found counter that only goes up --------------
const SAVE_KEY = 'kulteo-oeuvre-mystere-grille-v1';
let save = { results: {}, found: [] };
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* private mode */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* not kept */ } }
if (params.get('fresh') === '1') save = { results: {}, found: [] };

// ---- Input: keys go through the step (arrows choose, Enter proposes, X crosses out) ---
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// ---- State and scenes --------------------------------------------------------------------
let scene, state, dirty = true, dockDirty = true, shown = null;
const firstUnplayed = () => PARTIES.findIndex(p => !save.results[p.n]);
const party = () => PARTIES[state.pid];
const emo = () => EMOTIONS[party().emotion];
function reset(pid) {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const first = firstUnplayed();
  pid = pid ?? (state ? state.pid : params.get('party') ? Number(params.get('party')) - 1 : (first < 0 ? 0 : first));
  state = { t: 0, score: 0, gained: '', pid, guesses: [], revealed: 1, done: false, found: false, at: 0,
    sel: null, crossed: [], msg: '', newClue: 0, endT: 0, toast: '', toastT: 0, order: [] };
  state.order = gridOf(PARTIES[pid]);
  seed = Number(params.get('seed')) || CONFIG.seed;
  dirty = true;
}
function go(s) { scene = s; dirty = true; events.push({ scene: s }); }
function startParty(pid) {
  reset(pid);
  const r = save.results[party().n];
  if (r) { Object.assign(state, { guesses: r.guesses, found: r.found, at: r.at, done: true, revealed: 6 }); go('results'); }
  else { go('play'); }
}
function toast(m) { state.toast = m; state.toastT = tune.toast_s; dockDirty = true; }

const isTried = t => state.guesses.some(g => g && norm(g) === norm(t));
function select(t) { if (state.done || isTried(t)) return; state.sel = state.sel === t ? null : t; state.msg = ''; dirty = dockDirty = true; }
function move(d) { // arrows walk the grid (2 columns), skipping works already tried
  const n = state.order.length;
  let i = state.order.findIndex(w => w.title === state.sel);
  const skip = w => isTried(w.title) || state.crossed.includes(w.title); // a crossed-out work stays a tap away
  if (i < 0) { i = state.order.findIndex(w => !skip(w)); }
  else { let j = i + d; while (j >= 0 && j < n && skip(state.order[j])) j += d; if (j >= 0 && j < n) i = j; }
  if (i >= 0) { state.sel = state.order[i].title; dirty = dockDirty = true; }
}
function toggleCross() {
  if (!state.sel) { state.msg = 'Touchez d\'abord une œuvre à barrer.'; dockDirty = true; return; }
  const k = state.crossed.indexOf(state.sel);
  if (k < 0) { state.crossed.push(state.sel); state.sel = null; } else state.crossed.splice(k, 1);
  dirty = dockDirty = true;
}
function submit(title) {
  if (state.done || state.endT > 0) return;
  if (!title) { state.msg = 'Touchez une œuvre de la grille, puis proposez-la.'; dockDirty = true; return; }
  if (isTried(title)) { state.msg = 'Déjà proposée. Cet essai ne compte pas.'; dockDirty = true; return; }
  attempt(title);
}
function attempt(title) { // title null = Passer
  const ok = title !== null && norm(title) === norm(party().title);
  state.guesses.push(title);
  state.sel = null; state.msg = '';
  events.push({ guess: title, ok });
  if (ok) finish(true);
  else if (state.guesses.length >= PARTIES_CLUES) finish(false);
  else { state.revealed = state.guesses.length + 1; state.newClue = state.revealed; }
  dirty = dockDirty = true;
}
const PARTIES_CLUES = 6; // six clues, so six tries (the concept)
function finish(found) {
  state.done = true; state.found = found; state.at = found ? state.guesses.length : 0;
  state.revealed = found ? state.revealed : 6;
  state.gained = found ? `trouvée au ${ordinal(state.at)} indice` : 'pas trouvée';
  save.results[party().n] = { found, at: state.at, guesses: state.guesses.slice() };
  if (found && !save.found.includes(party().n)) save.found.push(party().n);
  persist();
  state.endT = tune.reveal_delay_s;
}

// ---- Views -------------------------------------------------------------------------------
function setEmotionVars() {
  const e = emo(), r = document.documentElement.style;
  r.setProperty('--em-bg', e.bg); r.setProperty('--em-fg', e.fg);
  r.setProperty('--flip', tune.flip_s + 's');
  r.setProperty('--blur-art', tune.blur_art_px + 'px');
  r.setProperty('--blur-ini', tune.blur_initials_px + 'px');
}
function bar(back, mid, num, tint) { // in a game the bar takes the emotion: clue 1 stays in view while scrolling
  $('bar').className = tint ? 'tint' : '';
  $('bar').innerHTML = (back ? `<button class="back" data-act="home">${svg(BACK)}Accueil</button>` : '<span class="brand">kulteo</span>')
    + `<div class="mid h">${mid}</div><div class="num">${tint ? `<span class="pill"><i>${svg(GLYPH[party().emotion])}</i>${emo().name}</span>` : ''}${num || ''}</div>`;
}
function visual(p, clear) { // clue 6: drawn from the emotion's colours, never a real poster
  const g = GLYPH[p.emotion], m = MEDIA[p.media];
  const a = p.n * 47;
  return `<div class="visual${clear ? ' clear' : ''}" style="background:${EMOTIONS[p.emotion].bg};color:${EMOTIONS[p.emotion].fg}">
    <div class="art">
      <svg viewBox="0 0 48 48" class="glyph" style="left:-30%;top:-10%;width:150%;transform:rotate(${a % 40 - 20}deg);opacity:.55">${g}</svg>
      <svg viewBox="0 0 48 48" class="glyph" style="right:-25%;bottom:-5%;width:90%;opacity:.4;stroke-width:6">${m}</svg>
      <svg viewBox="0 0 48 48" class="glyph" style="left:10%;bottom:20%;width:40%;opacity:.7;transform:rotate(${a % 90}deg)">${g}</svg>
    </div>
    <div class="ini">${esc(initials(p.title))}</div>
    ${clear ? `<div class="cap">${esc(p.title)}</div>` : ''}
  </div>`;
}
function clueHTML(i, p, isNew) {
  const nw = isNew ? ' new' : '';
  const k = `<span class="k">${i}</span>`;
  if (i === 2) return `<li class="clue${nw}">${k}<div><div class="lab">Média et décennie</div><div class="val h"><i class="mico">${svg(MEDIA[p.media])}</i>${p.media}, ${decade(p.year)}</div></div></li>`;
  if (i === 3) return `<li class="clue${nw}">${k}<div><div class="lab">Un mot-clé posé par des membres</div><div class="val"><span class="kw">${esc(p.keyword)}</span></div></div></li>`;
  if (i === 4) return `<li class="clue${nw}">${k}<div><div class="lab">Un membre a écrit</div><q>${esc(p.clue4.text)}</q></div></li>`;
  if (i === 5) return `<li class="clue${nw}">${k}<div><div class="lab">Un autre membre a écrit</div><q>${esc(p.clue5.text)}</q></div></li>`;
  return `<li class="clue${nw}">${k}<div style="flex:1"><div class="lab">Le visuel, flouté, avec les initiales du titre</div>${visual(p, false)}</div></li>`;
}
const LOCKED_LABEL = { 2: 'Média et décennie', 3: 'Un mot-clé', 4: 'Un extrait de membre', 5: 'Un second extrait, plus parlant', 6: 'Le visuel flouté et les initiales' };

function renderHome() {
  const pid = state.pid;
  const p = PARTIES[pid], e = EMOTIONS[p.emotion];
  bar(false, '', '');
  const res = save.results[p.n];
  $('view').className = '';
  $('view').innerHTML = `
    <div class="daycard">
      <div class="top"><div class="ico">${svg(GLYPH[p.emotion])}</div>
        <div><small>L'Œuvre mystère du jour · n°${p.n}</small><div class="h">Quelle œuvre leur a fait ressentir ça ?</div></div></div>
      <div class="body">
        <ol>
          <li>Vous voyez ce que la communauté a ressenti : surtout une émotion, puis deux autres.</li>
          <li>16 œuvres, une seule est la bonne : touchez-en une, puis proposez-la.</li>
          <li>Chaque essai faux dévoile un indice. Barrez celles que les indices écartent.</li>
          <li>6 essais. « Passer » dévoile un indice sans proposer.</li>
        </ol>
        <button class="btn primary" data-act="play" data-pid="${pid}">${res ? 'Voir la révélation' : 'Jouer'}</button>
      </div>
    </div>
    <div class="counter"><span class="h big">${save.found.length}</span><span>œuvre${save.found.length > 1 ? 's' : ''} trouvée${save.found.length > 1 ? 's' : ''} depuis le début</span></div>
    <h2 class="h sec">Les jours passés restent jouables</h2>
    <div class="days">${PARTIES.map((q, i) => {
      const r = save.results[q.n], E = EMOTIONS[q.emotion];
      const st = r ? (r.found ? `trouvée au ${ordinal(r.at)} indice` : 'pas trouvée') : 'à jouer';
      return `<button class="day${i === pid ? ' cur' : ''}" data-act="pick" data-pid="${i}">
        <span class="sw" style="background:${E.bg};color:${E.fg}">${svg(GLYPH[q.emotion])}</span>
        <span><b>Œuvre n°${q.n}</b><span>${st}</span></span></button>`;
    }).join('')}</div>
    <p class="note">Prototype : extraits et pseudos inventés. Les parties sont gardées dans ce navigateur. Clavier : flèches pour choisir, Entrée pour proposer, X pour barrer.</p>`;
}
const RANK = ['surtout', 'puis', 'un peu'];
function blendHTML(p) { // the community's emotional fingerprint: three emotions, widths by share, no numbers shown
  const bars = p.blend.map(([k, w]) => `<i style="flex:${w};background:${EMOTIONS[k].bg}"></i>`).join('');
  const words = p.blend.map(([k], i) => `<li><span class="sq" style="background:${EMOTIONS[k].bg};outline:1px solid ${EMOTIONS[k].fg}"></span>${RANK[i]} <b>${EMOTIONS[k].name}</b></li>`).join('');
  return `<div class="blend" aria-label="Empreinte émotionnelle"><div class="bars">${bars}</div><ul>${words}</ul></div>`;
}
function renderPlay() {
  const p = party(), e = emo();
  bar(true, `n°${p.n}`, '', true);
  $('view').className = 'play';
  let list = '';
  for (let i = 2; i <= state.revealed; i++) list += clueHTML(i, p, i === state.newClue);
  if (state.revealed < 6) { // the clues still to come, on one line, so the grid stays close
    const left = 6 - state.revealed;
    list += `<li class="clue locked"><span class="k">${state.revealed + 1}</span><div><div class="lab"><i class="lock">${svg(LOCK)}</i>${LOCKED_LABEL[state.revealed + 1]}</div><div>${left > 1 ? `puis ${left - 1} autre${left > 2 ? 's' : ''} : ` : ''}chaque essai faux en dévoile un</div></div></li>`;
  }
  const remaining = state.order.filter(w => !isTried(w.title) && !state.crossed.includes(w.title)).length;
  const tiles = state.order.map(w => {
    const tried = isTried(w.title), ok = tried && norm(w.title) === norm(p.title), out = state.crossed.includes(w.title);
    const cls = ok ? 'ok' : tried ? 'tried' : out ? 'out' : state.sel === w.title ? 'sel' : '';
    return `<li><button class="tile ${cls}" data-act="tile" data-title="${esc(w.title)}" ${tried ? 'aria-disabled="true"' : ''}>
      ${tried && !ok || out ? `<i class="x">${svg(CROSS)}</i>` : ''}<b>${esc(w.title)}</b>
      </button></li>`; // the title only: media and year are clue 2
  }).join('');
  $('view').innerHTML = `
    <section class="emo"><div class="ico">${svg(GLYPH[p.emotion])}</div>
      <div style="flex:1"><small>Indice 1 · ce que la communauté a ressenti</small><div class="h">${e.name}</div>${blendHTML(p)}</div></section>
    <ol class="clues">${list}</ol>
    <div class="grid-head"><h2 class="h">Laquelle est-ce ?</h2><span>${remaining} en lice sur ${state.order.length}</span></div>
    <ul class="grid">${tiles}</ul>`;
  if (state.newClue) {
    const el = document.querySelector('.clue.new');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    state.newClue = 0;
  }
}
function renderDock() {
  const used = state.guesses.length;
  $('go').firstElementChild.textContent = state.sel ? `Proposer « ${state.sel} »` : 'Touchez une œuvre';
  $('cross').textContent = state.sel && state.crossed.includes(state.sel) ? 'Remettre' : 'Barrer';
  $('cross').disabled = !state.sel || state.done;
  $('pips').innerHTML = Array.from({ length: PARTIES_CLUES }, (_, i) => `<i class="${i < used ? 'used' : ''}"></i>`).join('')
    + `<span>${PARTIES_CLUES - used} essai${PARTIES_CLUES - used > 1 ? 's' : ''}</span>`;
  $('msg').textContent = state.msg;
  $('go').disabled = !state.sel || state.done; $('pass').disabled = state.done;
}
function shareText() {
  const p = party(), n = state.guesses.length;
  const dots = state.found ? Array(n - 1).fill('●').concat('○').join(' ') : Array(n).fill('●').join(' ');
  return `Kulteo · Œuvre mystère n°${p.n}\n${dots}  ${state.found ? `trouvée au ${ordinal(state.at)} indice` : 'pas trouvée'}\nkulteo.app/jeu`;
}
function renderResults() {
  const p = party(), e = emo(), n = state.guesses.length;
  bar(true, `n°${p.n}`, '', true);
  $('view').className = '';
  const reco = c => `<article class="reco"><header><span class="av">${esc(c.by[1].toUpperCase())}</span><b>${esc(c.by)}</b>
      <span class="pill" style="background:${e.bg};color:${e.fg}"><i>${svg(GLYPH[p.emotion])}</i>${e.name}</span></header><q>${esc(c.text)}</q></article>`;
  const dots = Array.from({ length: n }, (_, i) => state.found && i === n - 1 ? DOT('none', 'var(--ink)') : DOT(e.bg, e.fg)).join('');
  $('view').innerHTML = `
    <h1 class="h outcome">${state.found ? `Trouvée au ${ordinal(state.at)} indice` : 'Pas trouvée'}</h1>
    <div class="work">${visual(p, true)}
      <div><div class="h">${esc(p.title)}</div>
        <p>${p.media} · ${p.year}</p><p>${esc(p.creator)}</p>
        <div style="margin-top:8px">${blendHTML(p)}</div>
        <p style="margin-top:6px">Mot-clé : <b style="color:var(--ink)">${esc(p.keyword)}</b></p></div></div>
    <h2 class="h sec">Les recommandations d'où venaient les extraits</h2>
    ${reco(p.clue4)}${reco(p.clue5)}
    <div class="actions">
      <button class="btn primary" data-act="lib">Ajouter à ma bibliothèque</button>
      <button class="btn" data-act="reco">La recommander à quelqu'un</button>
      <button class="btn" data-act="share">Partager mon résultat</button>
    </div>
    <div class="share" aria-label="Aperçu du partage">
      <p><b>Kulteo · Œuvre mystère n°${p.n}</b></p>
      <p><span class="dots">${dots}</span>${state.found ? `trouvée au ${ordinal(state.at)} indice` : 'pas trouvée'}</p>
      <p style="color:var(--ink2)">kulteo.app/jeu</p>
    </div>
    <div class="links"><button class="btn" data-act="home">Autres jours</button><button class="btn" data-act="replay">Rejouer</button></div>`;
}
function renderFigures() {
  bar(false, 'Figures', '');
  $('view').className = '';
  $('view').innerHTML = `<h2 class="h sec">Les 8 émotions</h2><div class="figs">${Object.entries(EMOTIONS).map(([k, e]) =>
    `<div><div class="sw" style="background:${e.bg};color:${e.fg}">${svg(GLYPH[k])}</div>${e.name}</div>`).join('')}</div>
    <h2 class="h sec">Les 4 médias</h2><div class="figs">${Object.keys(MEDIA).map(m =>
    `<div><div class="sw" style="background:var(--card);border:1px solid var(--line)">${svg(MEDIA[m])}</div>${m}</div>`).join('')}</div>
    <h2 class="h sec">Indice 6 et révélation</h2><div class="figs" style="grid-template-columns:1fr 1fr">${visual(PARTIES[0], false)}${visual(PARTIES[0], true)}</div>`;
}
function renderToast() { $('toast').textContent = state.toast; }

const scenes = {
  figures: { update(dt) { state.t += dt; }, draw: renderFigures },
  title: {
    update() { if (pressed('Enter')) startParty(state.pid); },
    draw: renderHome,
  },
  play: {
    update(dt) {
      state.t += dt;
      if (state.endT > 0) { state.endT -= dt; if (state.endT <= 0) go('results'); return; }
      if (pressed('ArrowRight')) move(1);
      if (pressed('ArrowLeft')) move(-1);
      if (pressed('ArrowDown')) move(2);
      if (pressed('ArrowUp')) move(-2);
      if (pressed('Escape')) { state.sel = null; dirty = dockDirty = true; }
      if (pressed('KeyX')) toggleCross();
      const tag = document.activeElement && document.activeElement.tagName; // a focused button already clicks on Enter
      if (pressed('Enter') && tag !== 'BUTTON') submit(state.sel);
    },
    draw: renderPlay,
  },
  results: {
    update() { if (pressed('Enter') && document.activeElement === document.body) go('title'); },
    draw: renderResults,
  },
};

// ---- Clicks and typing -------------------------------------------------------------------
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'home') { const f = firstUnplayed(); if (f >= 0) state.pid = f; go('title'); scrollTo(0, 0); }
  else if (act === 'play') startParty(Number(el.dataset.pid));
  else if (act === 'pick') { state.pid = Number(el.dataset.pid); startParty(state.pid); scrollTo(0, 0); }
  else if (act === 'tile') { select(el.dataset.title); el.blur(); }
  else if (act === 'lib') toast(`${party().title} est ajoutée à votre bibliothèque (factice).`);
  else if (act === 'reco') toast('Choisissez à qui la recommander, et dites pourquoi (factice).');
  else if (act === 'share') {
    const t = shareText();
    const done = () => toast('Résultat copié : collez-le dans une messagerie.');
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Copie impossible ici : le texte est dans l\'aperçu.'); } ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  }
  else if (act === 'replay') { reset(state.pid); go('play'); scrollTo(0, 0); }
});
$('go').addEventListener('click', () => submit(state.sel));
$('cross').addEventListener('click', toggleCross);
$('pass').addEventListener('click', () => { if (!state.done && state.endT <= 0) attempt(null); });

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (state.toastT > 0) { state.toastT -= STEP; if (state.toastT <= 0) { state.toast = ''; dockDirty = true; } }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  drawFrame();
}
function drawFrame() {
  if (!dirty && !dockDirty && shown === scene) return;
  setEmotionVars();
  if (dirty || shown !== scene) scenes[scene].draw(); // a message or a toast redraws only the dock
  const playing = scene === 'play';
  $('dock').hidden = !playing;
  if (playing) renderDock();
  renderToast();
  shown = scene; dirty = dockDirty = false;
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true) {
    for (let i = 0; i < n; i++) step();
    if (draw) drawFrame();
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
